name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [kmpkt-docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kmpkt-docs
        uses: actions/checkout@v4

      - name: Checkout kmpkt (docs source)
        uses: actions/checkout@v4
        with:
          repository: kmpktio/kmpkt
          path: _upstream/kmpkt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          KMPKT_REPO_DIR: _upstream/kmpkt
          VITEPRESS_BASE: /
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
